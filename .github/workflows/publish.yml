name: Publish

# INTENT: nuget.org 게시는 v<버전> 태그를 push할 때 이 워크플로만 한다. nuget.org의 Trusted Publishing
# 정책이 이 저장소와 파일 이름(publish.yml)을 가리키고, 실행마다 짧게만 유효한 키를 받으므로 API 키를
# 저장소나 PC에 두지 않는다. 파일 이름을 바꾸면 nuget.org의 정책도 함께 바꿔야 게시된다.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write   # nuget.org가 이 실행을 확인하는 GitHub OIDC 토큰 발급

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # .slnx는 .NET 10 SDK로 읽고, 테스트는 대상 프레임워크인 .NET 8 런타임에서 돈다
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x

    # nuget.org는 게시한 버전을 지울 수 없으므로, 태그와 프로젝트 버전이 다르면 게시하기 전에 멈춘다
    - name: Verify tag matches project version
      shell: pwsh
      run: |
        $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
        $projectVersion = dotnet msbuild Siakun.AutoUpdate/Siakun.AutoUpdate.csproj -getProperty:Version -nologo
        if ($tagVersion -ne $projectVersion) {
          throw "Tag version ($tagVersion) does not match project version ($projectVersion)."
        }

    - name: Test
      run: dotnet test Siakun.AutoUpdate.slnx --configuration Release

    - name: Pack
      run: dotnet pack Siakun.AutoUpdate/Siakun.AutoUpdate.csproj --configuration Release --output artifacts

    - name: NuGet login
      id: login
      uses: NuGet/login@v1
      with:
        user: siakun   # nuget.org 사용자 이름. 비밀 값이 아니다

    # 패키지를 와일드카드가 아니라 파일마다 전체 경로로 넘긴다. Windows의 dotnet nuget push는
    # 'artifacts/*.nupkg'처럼 '/'로 쓴 와일드카드를 풀지 못하고 파일이 없다며 실패한다.
    # 같은 버전이 이미 게시돼 있으면 건너뛰어, 게시 뒤 실행을 다시 돌려도 실패로 끝나지 않는다
    - name: Push to nuget.org
      shell: pwsh
      run: |
        $packages = @(Get-ChildItem -Path artifacts -Filter *.nupkg)
        if ($packages.Count -eq 0) { throw 'artifacts에 게시할 패키지가 없습니다.' }
        foreach ($package in $packages) {
          dotnet nuget push $package.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
            --source https://api.nuget.org/v3/index.json --skip-duplicate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
